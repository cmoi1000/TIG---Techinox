services:
  techinox-gestion:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3210"          # Coolify (ou votre reverse-proxy) route vers ce port en interne
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./data:/app/data   # db.json, users.json, pdfs/ — persistant, jamais écrasé par une image rebuild
    restart: always
