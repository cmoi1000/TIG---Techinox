services:
  techinox-gestion:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3210"          # Coolify (ou votre reverse-proxy) route vers ce port en interne
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      # Volume Docker nommé — géré par Docker, indépendant du répertoire de
      # checkout du dépôt (que Coolify peut recréer à chaque déploiement).
      # Persiste tant que la ressource/le volume n'est pas supprimé explicitement.
      - tig-data:/app/data
    restart: always

volumes:
  tig-data:
